<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTL — Universal Transport Ltd Event Calendar</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0f0a1e;
            --bg-card: #1c1333;
            --bg-hover: #261a45;
            --primary-blue: #1CC8FA;
            --deep-purple: #3F186F;
            --accent-purple: #2D1048;
            --text-light: #ffffff;
            --text-dim: #b8b2d1;
            --border-color: #382563;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f1c40f;
            --discord-blurple: #5865F2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--accent-purple), var(--bg-card));
            padding: 15px 40px;
            border-bottom: 2px solid var(--primary-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-logo {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .header-logo img {
            height: 42px;
            object-fit: contain;
        }

        .header-logo span {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-blue);
            letter-spacing: 0.5px;
        }

        .header-logo p {
            font-size: 12px;
            color: var(--text-dim);
            padding-left: 2px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--primary-blue);
            color: var(--bg-dark);
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            font-size: 13px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-discord {
            background-color: var(--discord-blurple);
            color: #ffffff;
        }

        .btn-secondary {
            background-color: var(--deep-purple);
            color: var(--text-light);
            border: 1px solid var(--primary-blue);
        }

        .btn-danger {
            background-color: var(--danger);
            color: #ffffff;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        main {
            flex: 1;
            max-width: 1500px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .sidebar-overview {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .sidebar-overview h3 {
            font-size: 16px;
            color: var(--primary-blue);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .overview-event-item {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.1s;
        }

        .overview-event-item:hover {
            border-color: var(--primary-blue);
            transform: translateX(3px);
        }

        .overview-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .overview-meta {
            font-size: 11px;
            color: var(--text-dim);
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .calendar-section {
            display: flex;
            flex-direction: column;
        }

        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .month-display {
            font-size: 22px;
            font-weight: bold;
            color: var(--text-light);
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-tab {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-dim);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tab.active, .filter-tab:hover {
            background-color: var(--deep-purple);
            color: var(--primary-blue);
            border-color: var(--primary-blue);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }

        .day-header {
            text-align: center;
            font-weight: bold;
            color: var(--text-dim);
            padding: 10px 0;
            font-size: 14px;
            text-transform: uppercase;
        }

        .calendar-cell {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            min-height: 120px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.2s;
        }

        .calendar-cell:hover {
            border-color: var(--primary-blue);
        }

        .calendar-cell.other-month {
            opacity: 0.4;
        }

        .cell-number {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dim);
            align-self: flex-end;
        }

        .event-chip {
            font-size: 11px;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: transform 0.1s;
        }

        .event-chip:hover {
            transform: scale(1.02);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 10, 30, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: var(--bg-card);
            border: 1px solid var(--primary-blue);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: var(--primary-blue);
            font-size: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 20px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-light);
            font-size: 14px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--primary-blue);
            outline: none;
        }

        .file-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-input-wrapper input[type="file"] {
            background: transparent;
            border: none;
            padding: 4px 0;
        }

        .rsvp-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        .rsvp-btn {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-dark);
            color: var(--text-light);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .rsvp-btn.attending.active { background: var(--success); border-color: var(--success); color: #fff; }
        .rsvp-btn.unsure.active { background: var(--warning); border-color: var(--warning); color: #000; }
        .rsvp-btn.declined.active { background: var(--danger); border-color: var(--danger); color: #fff; }

        .staff-rsvp-breakdown {
            margin-top: 15px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .staff-rsvp-breakdown h4 {
            color: var(--primary-blue);
            margin-bottom: 8px;
            font-size: 13px;
        }

        .staff-rsvp-category {
            margin-bottom: 6px;
        }

        .lightbox-card {
            max-width: 90vw;
            max-height: 90vh;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox-card img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 8px;
            border: 2px solid var(--primary-blue);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        #modal-body {
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-logo">
            <img src="UTL3DLong.jpg" alt="Universal Transport Ltd Logo" onerror="this.style.display='none'; document.getElementById('fallback-title').style.display='block';">
            <span id="fallback-title" style="display:none;">UNIVERSAL TRANSPORT LTD</span>
            <p>Interactive VTC Event & Convoy Calendar</p>
        </div>
        <div class="header-actions">
            <button class="btn btn-discord" id="discord-login-btn" onclick="loginWithDiscord()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle; margin-right: 5px;"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.093.252-.19.372-.287a.075.075 0 0 1 .078-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.009c.12.098.245.195.372.288a.077.077 0 0 1-.006.128 12.299 12.299 0 0 1-1.873.891.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                <span id="discord-btn-text">Login with Discord</span>
            </button>

            <button class="btn btn-secondary" onclick="prevMonth()">◀ Prev</button>
            <span id="current-month-label" class="month-display" style="font-size: 16px;">October 2026</span>
            <button class="btn btn-secondary" onclick="nextMonth()">Next ▶</button>

            <button class="btn" id="management-btn" onclick="openManagementModal()">⚙️ Management Panel</button>
            <button class="btn btn-outline" id="staff-logout-btn" style="display: none;" onclick="logoutDiscord()">Log Out</button>
        </div>
    </header>

    <main>
        <aside class="sidebar-overview">
            <h3>📋 All Scheduled Events <span id="event-count-badge" style="font-size: 12px; color: var(--primary-blue);">(0)</span></h3>
            <div id="sidebar-events-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </aside>

        <div class="calendar-section">
            <div class="calendar-controls">
                <div class="filter-tabs">
                    <button class="filter-tab active" onclick="filterEvents('all', event)">All Events</button>
                    <button class="filter-tab" onclick="filterEvents('truckfest', event)">🎪 Truckfest</button>
                    <button class="filter-tab" onclick="filterEvents('convoy', event)">🚛 Convoys</button>
                    <button class="filter-tab" onclick="filterEvents('charity', event)">❤️ Charity</button>
                    <button class="filter-tab" onclick="filterEvents('utl_own', event)">🌟 UTL Exclusive</button>
                </div>
            </div>

            <div class="calendar-grid" id="calendar-header-grid">
                <div class="day-header">Mon</div>
                <div class="day-header">Tue</div>
                <div class="day-header">Wed</div>
                <div class="day-header">Thu</div>
                <div class="day-header">Fri</div>
                <div class="day-header">Sat</div>
                <div class="day-header">Sun</div>
            </div>
            <div class="calendar-grid" id="calendar-days-grid" style="margin-top: 10px;"></div>
        </div>
    </main>

    <!-- Event Details Modal -->
    <div class="modal-overlay" id="event-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modal-title">Event Title</h2>
                <button class="close-btn" onclick="closeModal('event-modal')">×</button>
            </div>
            <div id="modal-body"></div>
            
            <div style="margin-top: 25px;">
                <p style="text-align: center; font-size: 13px; color: var(--text-dim); margin-bottom: 10px;" id="rsvp-status-label">Your RSVP Status</p>
                <div class="rsvp-container">
                    <button class="rsvp-btn attending" id="rsvp-yes" onclick="setRSVP('attending')">✅ Attending</button>
                    <button class="rsvp-btn unsure" id="rsvp-maybe" onclick="setRSVP('unsure')">❓ Unsure</button>
                    <button class="rsvp-btn declined" id="rsvp-no" onclick="setRSVP('declined')">❌ Unable</button>
                </div>

                <!-- Staff Detailed Name Breakdown -->
                <div id="staff-rsvp-breakdown-box" class="staff-rsvp-breakdown" style="display: none;">
                    <h4>👥 Staff RSVP Roster View</h4>
                    <div class="staff-rsvp-category" id="breakdown-attending">✅ <strong>Attending:</strong> None</div>
                    <div class="staff-rsvp-category" id="breakdown-unsure">❓ <strong>Unsure:</strong> None</div>
                    <div class="staff-rsvp-category" id="breakdown-declined">❌ <strong>Unable:</strong> None</div>
                </div>

                <div style="margin-top: 15px;">
                    <button class="btn btn-secondary" style="width: 100%; border-color: var(--primary-blue);" onclick="triggerDiscordReminder()">🔔 Set Discord Event Reminder</button>
                </div>

                <div id="staff-actions-container" style="margin-top: 15px; display: none; gap: 10px;">
                    <button class="btn btn-secondary" style="flex: 1; border-color: var(--primary-blue);" onclick="openEditEventModal()">✏️ Edit Event</button>
                    <button class="btn btn-danger" style="flex: 1;" onclick="deleteCurrentEvent()">🗑️ Delete Event</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div class="modal-overlay" id="lightbox-modal" onclick="closeModal('lightbox-modal')">
        <div class="lightbox-card">
            <img id="lightbox-img" src="" alt="Enlarged Route Map">
        </div>
    </div>

    <!-- Management Modal (Publish / Edit) -->
    <div class="modal-overlay" id="management-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="management-modal-title">⚙️ Events Team Control Panel</h2>
                <button class="close-btn" onclick="closeModal('management-modal')">×</button>
            </div>
            <form id="event-form" onsubmit="handleEventSubmit(event)">
                <input type="hidden" id="edit-event-id">
                <div class="form-group">
                    <label>Event Title</label>
                    <input type="text" id="evt-title" required placeholder="e.g. Alpine Night Run">
                </div>
                <div class="form-group">
                    <label>Event Category / Type</label>
                    <select id="evt-type">
                        <option value="truckfest">🎪 Truckfest + Convoy</option>
                        <option value="convoy">🚛 Standard Convoy</option>
                        <option value="charity">❤️ Charity Convoy</option>
                        <option value="utl_own">🌟 UTL Own Convoy Event</option>
                        <option value="custom_vtc">🎨 Custom VTC Event</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date & Time (UK Time)</label>
                    <input type="datetime-local" id="evt-date" required>
                </div>
                <div class="form-group">
                    <label>Simulation Server</label>
                    <input type="text" id="evt-server" required placeholder="Simulation 1">
                </div>
                <div class="form-group">
                    <label>Route Details</label>
                    <input type="text" id="evt-route" required placeholder="Innsbruck ➔ Salzburg">
                </div>
                <div class="form-group">
                    <label>Event Description (Supports **Bold**, *Italic*, <u>Underline</u>, [Slot](link) & New Lines)</label>
                    <textarea id="evt-desc" rows="5" placeholder="Additional convoy rules, slot details, or instructions..."></textarea>
                </div>
                <div class="form-group">
                    <label>Route Map Image (URL or Local Upload)</label>
                    <div class="file-input-wrapper">
                        <input type="url" id="evt-img-url" placeholder="https://i.imgur.com/...">
                        <input type="file" id="evt-img-file" accept="image/*">
                    </div>
                </div>
                <button type="submit" class="btn" id="form-submit-btn" style="width: 100%; margin-top: 10px;">Publish Event</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jmfxrkmvriefrulivley.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptZnhya212cmllZnJ1bGl2bGV5Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NjM1OTgzMywiZXhwIjoyMTAxOTM1ODMzfQ.T2bn16_KraZtIM86ByJDRiVALoLpwN3yZGe7lBifLc4'; 
        
        const DISCORD_CLIENT_ID = '1414051513600573440'; 
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        let dbClient = null;
        try {
            dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
            console.error('Supabase error:', e);
        }

        let currentDate = new Date(2026, 9, 1);
        let currentFilter = 'all';
        let activeEventId = null;
        let events = [];

        const categoryColors = {
            truckfest: '#1CC8FA',
            convoy: '#3498DB',
            charity: '#E74C3C',
            utl_own: '#9B59B6',
            custom_vtc: '#F1C40F'
        };

        window.loginWithDiscord = function() {
            const scope = encodeURIComponent('identify guilds guilds.members.read');
            const redirect = encodeURIComponent(REDIRECT_URI);
            const authUrl = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${redirect}&response_type=token&scope=${scope}`;
            window.location.href = authUrl;
        };

        async function handleDiscordCallback() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                window.history.replaceState({}, document.title, window.location.pathname);
                localStorage.setItem('discord_access_token', accessToken);
            }

            const token = localStorage.getItem('discord_access_token');
            if (!token) return;

            try {
                const userRes = await fetch('https://discord.com/api/v10/users/@me', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                if (!userRes.ok) throw new Error('Failed user fetch');
                const userData = await userRes.json();

                const userName = userData.global_name || userData.username;
                localStorage.setItem('utl_user_name', userName);
                localStorage.setItem('utl_discord_id', userData.id);

                document.getElementById('discord-btn-text').innerText = userName;

                // Check staff authorization directly via Supabase (bypasses BisectHosting SSL/mixed-content block)
                if (dbClient) {
                    const { data: staffData, error: staffError } = await dbClient
                        .from('authorized_staff')
                        .select('*')
                        .eq('user_id', userData.id)
                        .single();

                    if (staffData && !staffError) {
                        localStorage.setItem('utl_staff_unlocked', 'true');
                    } else {
                        localStorage.removeItem('utl_staff_unlocked');
                    }
                }
            } catch (err) {
                console.error('Discord auth error:', err);
            }

            updateAuthUI();
        }

        function updateAuthUI() {
            const userName = localStorage.getItem('utl_user_name');
            const isStaff = localStorage.getItem('utl_staff_unlocked') === 'true';

            const btnText = document.getElementById('discord-btn-text');
            const logoutBtn = document.getElementById('staff-logout-btn');
            const staffActions = document.getElementById('staff-actions-container');
            const rosterBox = document.getElementById('staff-rsvp-breakdown-box');

            if (userName) {
                btnText.innerText = `👤 ${userName}`;
                if (logoutBtn) logoutBtn.style.display = 'inline-block';
            } else {
                btnText.innerText = 'Login with Discord';
                if (logoutBtn) logoutBtn.style.display = 'none';
            }

            if (isStaff) {
                if (staffActions) staffActions.style.display = 'flex';
                if (rosterBox) rosterBox.style.display = 'block';
            } else {
                if (staffActions) staffActions.style.display = 'none';
                if (rosterBox) rosterBox.style.display = 'none';
            }
        }

        window.openManagementModal = function() {
            const isStaff = localStorage.getItem('utl_staff_unlocked') === 'true';
            
            if (!isStaff) {
                alert('❌ Access denied. You must be logged in with a Discord account holding the Management or Events Team role.');
                return;
            }

            document.getElementById('event-form').reset();
            document.getElementById('edit-event-id').value = '';
            document.getElementById('management-modal-title').innerText = '⚙️ Events Team Control Panel (Publish)';
            document.getElementById('form-submit-btn').innerText = 'Publish Event';

            const modal = document.getElementById('management-modal');
            if (modal) modal.classList.add('active');
        };

        window.openEditEventModal = function() {
            const evt = events.find(e => e.id === activeEventId);
            if (!evt) return;

            closeModal('event-modal');

            document.getElementById('edit-event-id').value = evt.id;
            document.getElementById('evt-title').value = evt.title;
            document.getElementById('evt-type').value = evt.type;
            
            if (evt.date) {
                document.getElementById('evt-date').value = evt.date.slice(0, 16);
            }

            document.getElementById('evt-server').value = evt.server || '';
            document.getElementById('evt-route').value = evt.route || '';
            document.getElementById('evt-desc').value = evt.description || '';
            document.getElementById('evt-img-url').value = evt.routeImage || '';

            document.getElementById('management-modal-title').innerText = '✏️ Edit Event: ' + evt.title;
            document.getElementById('form-submit-btn').innerText = 'Save Changes';

            const modal = document.getElementById('management-modal');
            if (modal) modal.classList.add('active');
        };

        window.logoutDiscord = function() {
            localStorage.removeItem('discord_access_token');
            localStorage.removeItem('utl_user_name');
            localStorage.removeItem('utl_discord_id');
            localStorage.removeItem('utl_staff_unlocked');
            updateAuthUI();
            alert('🔒 Logged out.');
        };

        async function fetchEvents() {
            if (!dbClient) {
                renderCalendar();
                return;
            }

            try {
                const { data, error } = await dbClient
                    .from('utl_events')
                    .select('*')
                    .order('event_date', { ascending: true });

                if (!error && data) {
                    events = data.map(e => ({
                        id: e.id,
                        title: e.title,
                        type: e.event_type,
                        date: e.event_date,
                        server: e.server,
                        route: e.route,
                        description: e.description || '',
                        routeImage: e.route_image || '',
                        rsvps: e.rsvps || { attending: 0, unsure: 0, declined: 0 },
                        driverRsvps: e.driver_rsvps || {}
                    }));
                }
            } catch (err) {
                console.error('Fetch error:', err);
            }
            renderCalendar();
        }

        window.renderCalendar = function() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            
            const monthLabel = document.getElementById('current-month-label');
            if (monthLabel) monthLabel.innerText = `${monthNames[month]} ${year}`;
            
            const grid = document.getElementById('calendar-days-grid');
            if (grid) {
                grid.innerHTML = '';
                const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
                const totalDays = new Date(year, month + 1, 0).getDate();

                for (let i = 0; i < firstDayIndex; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'calendar-cell other-month';
                    grid.appendChild(cell);
                }

                for (let day = 1; day <= totalDays; day++) {
                    const cell = document.createElement('div');
                    cell.className = 'calendar-cell';
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    
                    cell.innerHTML = `<span class="cell-number">${day}</span>`;

                    const dayEvents = events.filter(e => e.date && e.date.startsWith(dateStr) && (currentFilter === 'all' || e.type === currentFilter));
                    
                    dayEvents.forEach(evt => {
                        const chip = document.createElement('div');
                        chip.className = 'event-chip';
                        chip.style.backgroundColor = categoryColors[evt.type] || '#1CC8FA';
                        chip.style.color = '#0f0a1e';
                        chip.innerText = evt.title;
                        chip.onclick = () => openEventModal(evt.id);
                        cell.appendChild(chip);
                    });

                    grid.appendChild(cell);
                }
            }

            const sidebarList = document.getElementById('sidebar-events-list');
            const countBadge = document.getElementById('event-count-badge');
            
            if (sidebarList) {
                sidebarList.innerHTML = '';
                const filteredAllEvents = events.filter(e => currentFilter === 'all' || e.type === currentFilter);
                if (countBadge) countBadge.innerText = `(${filteredAllEvents.length})`;

                if (filteredAllEvents.length === 0) {
                    sidebarList.innerHTML = `<p style="font-size:12px; color:var(--text-dim); text-align:center; padding: 10px;">No events found on the calendar.</p>`;
                } else {
                    filteredAllEvents.forEach(evt => {
                        const item = document.createElement('div');
                        item.className = 'overview-event-item';
                        item.onclick = () => {
                            if (evt.date) {
                                const evtDate = new Date(evt.date);
                                if (evtDate.getFullYear() !== currentDate.getFullYear() || evtDate.getMonth() !== currentDate.getMonth()) {
                                    currentDate = new Date(evtDate.getFullYear(), evtDate.getMonth(), 1);
                                    renderCalendar();
                                }
                            }
                            openEventModal(evt.id);
                        };
                        
                        const dateObj = new Date(evt.date);
                        const formattedDate = dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

                        item.innerHTML = `
                            <div class="overview-title">${evt.title}</div>
                            <div class="overview-meta">
                                <span>📅 ${formattedDate}</span>
                                <span>🖥️ ${evt.server}</span>
                            </div>
                        `;
                        sidebarList.appendChild(item);
                    });
                }
            }
        };

        window.prevMonth = function() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        };

        window.nextMonth = function() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        };

        window.filterEvents = function(type, btnEvent) {
            currentFilter = type;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            if (btnEvent && btnEvent.target) {
                btnEvent.target.classList.add('active');
            }
            renderCalendar();
        };

        window.closeModal = function(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.remove('active');
        };

        window.openLightbox = function(imgSrc) {
            const lightbox = document.getElementById('lightbox-modal');
            const lightboxImg = document.getElementById('lightbox-img');
            if (lightbox && lightboxImg) {
                lightboxImg.src = imgSrc;
                lightbox.classList.add('active');
            }
        };

        window.triggerDiscordReminder = function() {
            const evt = events.find(e => e.id === activeEventId);
            if (!evt) return;

            const discordId = localStorage.getItem('utl_discord_id');
            const userName = localStorage.getItem('utl_user_name');

            if (!discordId) {
                alert('⚠️ Please click "Login with Discord" in the header so Universal Bot knows which Discord account to DM!');
                loginWithDiscord();
                return;
            }

            alert(`🔔 Reminder requested for ${userName}!\n\nOur Discord Bot will send a DM reminder to your account prior to the launch of "${evt.title}".`);
        };

        window.handleEventSubmit = async function(e) {
            e.preventDefault();
            if (!dbClient) {
                alert('Supabase is not configured.');
                return;
            }

            const editId = document.getElementById('edit-event-id').value;
            const fileInput = document.getElementById('evt-img-file').files[0];
            let imageUrl = document.getElementById('evt-img-url').value.trim();

            if (fileInput) {
                imageUrl = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (evt) => resolve(evt.target.result);
                    reader.readAsDataURL(fileInput);
                });
            }

            const title = document.getElementById('evt-title').value;
            const type = document.getElementById('evt-type').value;
            const date = document.getElementById('evt-date').value;
            const server = document.getElementById('evt-server').value;
            const route = document.getElementById('evt-route').value;
            const desc = document.getElementById('evt-desc').value;

            let error = null;

            if (editId) {
                const updatePayload = {
                    title: title,
                    event_type: type,
                    event_date: date,
                    server: server,
                    route: route,
                    description: desc
                };
                if (imageUrl) updatePayload.route_image = imageUrl;

                const res = await dbClient
                    .from('utl_events')
                    .update(updatePayload)
                    .eq('id', editId);
                error = res.error;
            } else {
                const res = await dbClient
                    .from('utl_events')
                    .insert({
                        title: title,
                        event_type: type,
                        event_date: date,
                        server: server,
                        route: route,
                        description: desc,
                        route_image: imageUrl || null,
                        rsvps: { attending: 0, unsure: 0, declined: 0 },
                        driver_rsvps: {}
                    });
                error = res.error;
            }

            if (!error) {
                closeModal('management-modal');
                document.getElementById('event-form').reset();
                fetchEvents();
            } else {
                alert('Failed to save event: ' + error.message);
            }
        };

        window.deleteCurrentEvent = async function() {
            if (!activeEventId || !dbClient) return;
            if (!confirm('Are you sure you want to delete this event?')) return;

            const { error } = await dbClient
                .from('utl_events')
                .delete()
                .eq('id', activeEventId);

            if (!error) {
                closeModal('event-modal');
                fetchEvents();
            } else {
                alert('Failed to delete event: ' + error.message);
            }
        };

        function formatDescription(text) {
            if (!text) return '';
            
            // Basic HTML escape (prevent script injection)
            let escaped = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            // Preserve new lines first
            escaped = escaped.replace(/\n/g, '<br>');

            // Convert Markdown Links: [Link Text](URL) — handles bold/italics inside and multi-line URLs gracefully
            escaped = escaped.replace(/\[([^\]]+)\]\(\s*(https?:\/\/[^\s\)]+)\s*\)/g, function(match, textContent, url) {
                const cleanUrl = url.replace(/<br\s*[\/]?>/gi, '').replace(/&amp;/g, '&');
                return `<a href="${cleanUrl}" target="_blank" style="color: var(--primary-blue); text-decoration: underline; word-break: break-all;">${textContent}</a>`;
            });

            // Convert raw URLs to clickable links
            escaped = escaped.replace(/(https?:\/\/[^\s<"]+)/g, function(url) {
                if (url.includes('href=')) return url;
                const cleanUrl = url.replace(/&quot;|["']/g, '').replace(/&amp;/g, '&');
                return `<a href="${cleanUrl}" target="_blank" style="color: var(--primary-blue); text-decoration: underline; word-break: break-all;">${cleanUrl}</a>`;
            });

            // Bold: **text** or __text__
            escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            escaped = escaped.replace(/__(.*?)__/g, '<strong>$1</strong>');

            // Italic: *text* or _text_
            escaped = escaped.replace(/\*(.*?)\*/g, '<em>$1</em>');
            escaped = escaped.replace(/_(.*?)_/g, '<em>$1</em>');

            // Underline: <u>text</u>
            escaped = escaped.replace(/&lt;u&gt;(.*?)&lt;\/u&gt;/g, '<u>$1</u>');

            return escaped;
        }

        function openEventModal(eventId) {
            activeEventId = eventId;
            const evt = events.find(e => e.id === eventId);
            if (!evt) return;

            const userName = localStorage.getItem('utl_user_name');
            const statusLabel = document.getElementById('rsvp-status-label');
            if (userName) {
                statusLabel.innerHTML = `Your RSVP Status (<span style="color:var(--primary-blue);">${userName}</span>)`;
            } else {
                statusLabel.innerHTML = `Your RSVP Status <span style="color:var(--warning); font-size:11px;">(⚠️ Login with Discord to RSVP)</span>`;
            }

            document.getElementById('modal-title').innerText = evt.title;
            
            let imgHTML = evt.routeImage 
                ? `<div style="margin-bottom:15px; text-align:center;">
                     <img src="${evt.routeImage}" style="max-width:100%; max-height:220px; border-radius:8px; cursor:pointer;" onclick="openLightbox('${evt.routeImage}')" title="Click to enlarge route map">
                     <p style="font-size:11px; color:var(--text-dim); margin-top:4px;">🔍 Click image to enlarge</p>
                   </div>` 
                : '';

            let descHTML = evt.description 
                ? `<div style="margin-bottom: 12px; background: var(--bg-dark); padding: 10px; border-radius: 6px; font-size: 13px; color: var(--text-dim); word-break: break-word; overflow-wrap: break-word; white-space: pre-wrap;"><strong>📝 Description:</strong><br>${formatDescription(evt.description)}</div>`
                : '';

            document.getElementById('modal-body').innerHTML = `
                ${imgHTML}
                <p style="margin-bottom: 8px;"><strong>📅 Date & Time:</strong> ${new Date(evt.date).toLocaleString('en-GB')}</p>
                <p style="margin-bottom: 8px;"><strong>🖥️ Server:</strong> ${evt.server}</p>
                <p style="margin-bottom: 8px;"><strong>🗺️ Route:</strong> ${evt.route}</p>
                ${descHTML}
                <div style="display:flex; gap:15px; margin-top:15px; font-size:13px; color:var(--text-dim);">
                    <span>✅ Attending: <strong>${evt.rsvps.attending}</strong></span>
                    <span>❓ Unsure: <strong>${evt.rsvps.unsure}</strong></span>
                    <span>❌ Unable: <strong>${evt.rsvps.declined}</strong></span>
                </div>
            `;

            const attendingList = [];
            const unsureList = [];
            const declinedList = [];

            if (evt.driverRsvps) {
                Object.entries(evt.driverRsvps).forEach(([driverName, status]) => {
                    if (status === 'attending') attendingList.push(driverName);
                    if (status === 'unsure') unsureList.push(driverName);
                    if (status === 'declined') declinedList.push(driverName);
                });
            }

            document.getElementById('breakdown-attending').innerHTML = `✅ <strong>Attending (${attendingList.length}):</strong> ${attendingList.length ? attendingList.join(', ') : 'None'}`;
            document.getElementById('breakdown-unsure').innerHTML = `❓ <strong>Unsure (${unsureList.length}):</strong> ${unsureList.length ? unsureList.join(', ') : 'None'}`;
            document.getElementById('breakdown-declined').innerHTML = `❌ <strong>Unable (${declinedList.length}):</strong> ${declinedList.length ? declinedList.join(', ') : 'None'}`;

            document.querySelectorAll('.rsvp-btn').forEach(b => b.classList.remove('active'));
            
            const userRsvp = userName && evt.driverRsvps ? evt.driverRsvps[userName] : null;
            if (userRsvp) {
                if (userRsvp === 'attending') document.getElementById('rsvp-yes').classList.add('active');
                if (userRsvp === 'unsure') document.getElementById('rsvp-maybe').classList.add('active');
                if (userRsvp === 'declined') document.getElementById('rsvp-no').classList.add('active');
            }

            updateAuthUI();

            const modal = document.getElementById('event-modal');
            if (modal) modal.classList.add('active');
        }

        window.setRSVP = async function(status) {
            const userName = localStorage.getItem('utl_user_name');
            if (!userName) {
                alert('⚠️ Please click "Login with Discord" in the top header first!');
                loginWithDiscord();
                return;
            }

            const evt = events.find(e => e.id === activeEventId);
            if (!evt || !dbClient) return;

            if (!evt.driverRsvps) evt.driverRsvps = {};
            const previousStatus = evt.driverRsvps[userName];

            if (previousStatus) {
                evt.rsvps[previousStatus] = Math.max(0, evt.rsvps[previousStatus] - 1);
            }

            if (previousStatus === status) {
                delete evt.driverRsvps[userName];
            } else {
                evt.driverRsvps[userName] = status;
                evt.rsvps[status] = (evt.rsvps[status] || 0) + 1;
            }

            await dbClient
                .from('utl_events')
                .update({ rsvps: evt.rsvps, driver_rsvps: evt.driverRsvps })
                .eq('id', evt.id);

            openEventModal(activeEventId);
            renderCalendar();
        };

        handleDiscordCallback();
        renderCalendar(); 
        fetchEvents();
    </script>
</body>
